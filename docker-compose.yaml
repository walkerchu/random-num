# Exercise 3.2. Deployment pipeline to a cloud service
# created at Nov 01, 2026 17:32 HKT

services:
  # Development container
  dev:
    # Build image using Dockerfile in current folder
    build: .

    # Default working directory inside container
    working_dir: /app

    # Synchronize current project folder with /app in container
    #
    # Host                    Container
    # ./main.py      <---->   /app/main.py
    # ./test_main.py <---->   /app/test_main.py
    #
    # Any change in VS Code is immediately visible inside container
    volumes:
      - .:/app

    # Keep STDIN open so we can interact with bash
    stdin_open: true

    # Allocate a pseudo terminal
    # Allows commands like:
    # docker compose run --rm dev bash
    tty: true

    # Optional port mapping
    #
    # Host:8000 -> Container:8000
    #
    # Useful when running:
    # uvicorn main:app --host 0.0.0.0 --port 8000
    #
    # Then browse:
    # http://localhost:8000
    ports:
      - "8000:8000"
